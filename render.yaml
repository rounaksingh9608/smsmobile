databases:
  - name: sms-db
    databaseName: sms
    user: sms_user
    plan: free

services:
  - type: web
    name: sms-backend
    env: node
    rootDir: app
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sms-db
          property: connectionString

databases:
  - name: sociohub-db
    databaseName: sociohub
    user: admin
    plan: free

services:
  - type: web
    name: sociohub-backend
    env: node
    rootDir: app
    buildCommand: npm install && npm run build
    startCommand: npm run start
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sociohub-db
          property: connectionString
      - key: NODE_VERSION
        value: "20"
